# 소리톡 단일 오리진 배포
#  - api  : weekly Express 백엔드(:4000, 기존 apps/weekly/Dockerfile 재사용). 호스트 MySQL 사용.
#  - aqua : 관상어도감 Next.js(:3000, basePath /aqua). 호스트 MySQL 의 aquado DB 사용.
#  - web  : 5개 프론트 정적 + /api·/aqua 프록시(nginx). 외부에는 web 만 노출.
# 사용법: cp .env.example .env → 값 채우기 → ./deploy.sh (또는 docker compose up -d --build)
services:
  api:
    build:
      context: ./apps/weekly
    container_name: soritok_api
    restart: always
    extra_hosts:
      - "host.docker.internal:host-gateway" # 컨테이너에서 호스트 MySQL 접근
    environment:
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      THREADS_ACCESS_TOKEN: ${THREADS_ACCESS_TOKEN}
      THREADS_USER_ID: ${THREADS_USER_ID}
      THREADS_POLL_MINUTES: ${THREADS_POLL_MINUTES:-15}

  aqua:
    build:
      context: ./aqua
    container_name: soritok_aqua
    restart: always
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DATABASE_URL: ${AQUA_DATABASE_URL}
      NEXTAUTH_URL: ${AQUA_NEXTAUTH_URL:-https://soritok.com/aqua/api/auth}
      NEXTAUTH_SECRET: ${AQUA_NEXTAUTH_SECRET}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY} # 도감 글작성 (Claude) — 이미지는 Pollinations(무료, 키 불필요)
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
    volumes:
      - aqua_uploads:/app/public/uploads

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: soritok_web
    restart: always
    depends_on:
      - api
      - aqua
    # 호스트 nginx(80/443, certbot) 뒤에 둡니다 → 127.0.0.1 에만 바인드
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:80"
    volumes:
      # aqua 업로드 이미지를 nginx 가 직접 서빙 (Next standalone 은 런타임 추가 public 파일을 못 냄)
      - aqua_uploads:/aqua-uploads:ro

volumes:
  aqua_uploads:
