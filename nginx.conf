server {
    listen 80;
    server_name _;
    client_max_body_size 50m;
    # try_files 의 $uri/ 가 디렉터리 인덱스를 찾을 때 쓴다 (기본값에 의존하지 않게 명시)
    index index.html;

    # 리다이렉트를 상대 경로(Location: /games/)로 내보낸다.
    # 이 nginx 는 리버스 프록시 뒤라 자신이 HTTPS 인 줄 몰라서, 절대 URL 로
    # 만들면 http:// 로 나가고 브라우저·크롤러가 https 로 한 번 더 튄다.
    absolute_redirect off;

    # ------------------------------------------------------------------
    # 없는 경로는 반드시 404 로 응답한다 (=404).
    #
    # 이전엔 SPA 폴백(/index.html)이 걸려 있어, 존재하지 않는 "모든" 주소가
    # 200 + 동일한 허브 홈페이지를 반환했다. 그 결과 예전 블로그의 태그 URL
    # 수백 개(/tag/..., /en/tag/...)가 살아 있는 페이지로 취급돼 전부 중복
    # 콘텐츠로 잡혔고, 구글은 이 사이트를 "어떤 주소든 같은 얇은 페이지가
    # 나오는 사이트"로 판단했다(색인 리포트의 중복 144건·NOINDEX 107건).
    #
    # 허브와 서브앱 모두 클라이언트 라우터가 없어 폴백이 필요 없다.
    # 실제 파일($uri)과 디렉터리 인덱스($uri/)만 서빙한다.
    # ------------------------------------------------------------------

    # 슬래시 없는 앱 경로는 슬래시 버전으로 넘긴다.
    # (없는 경로를 404 로 바꾸면서 /games 같은 형태가 같이 죽었다.
    #  사람이 주소창에 흔히 이렇게 입력하고, 외부 링크도 이 형태가 섞인다)
    location = /weekly { return 301 /weekly/; }
    location = /gnugo  { return 301 /gnugo/; }
    location = /games  { return 301 /games/; }
    location = /study  { return 301 /study/; }
    location = /mbti   { return 301 /mbti/; }

    # 허브(루트, base '/')
    location / {
        root /usr/share/nginx/html/hub;
        try_files $uri $uri/ =404;
    }

    # 각 서비스 (base '/<name>/')
    location /weekly/ {
        alias /usr/share/nginx/html/weekly/;
        try_files $uri $uri/ =404;
    }
    location /gnugo/ {
        alias /usr/share/nginx/html/gnugo/;
        try_files $uri $uri/ =404;
    }
    location /games/ {
        alias /usr/share/nginx/html/games/;
        try_files $uri $uri/ =404;
    }
    location /study/ {
        alias /usr/share/nginx/html/study/;
        try_files $uri $uri/ =404;
    }
    location /mbti/ {
        alias /usr/share/nginx/html/mbti/;
        try_files $uri $uri/ =404;
    }


    # 관상어도감 업로드 이미지 — 볼륨을 nginx 가 직접 서빙 (더 구체적인 prefix 라 /aqua/ 보다 우선)
    location /aqua/uploads/ {
        alias /aqua-uploads/;
        expires 7d;
        add_header Cache-Control "public";
    }

    # 관상어도감 (Next.js 컨테이너, basePath /aqua — 루트는 /aqua 로 서빙, /aqua/ 는 Next가 308)
    location = /aqua {
        proxy_pass http://aqua:3000;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /aqua/ {
        proxy_pass http://aqua:3000;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 백엔드 API (weekly Express 컨테이너)
    location /api/ {
        proxy_pass http://api:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
