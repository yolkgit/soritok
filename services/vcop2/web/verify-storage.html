<!doctype html><html lang="ko"><meta charset="utf-8"><title>VCOP2 저장소 검사</title><body style="background:#101923;color:#d8e7f0;font:14px monospace;padding:24px"><h1>저장소 검사</h1><p>진단용 데이터만 사용하는 검사입니다. 실제 게임 기록과 분리됩니다.</p><button id="run">검사 실행</button><pre id="result">대기</pre><script type="module">
import {openRecords} from './records-store.mjs';
document.getElementById('run').onclick=async()=>{const output=document.getElementById('result');output.textContent='검사 중…';let db;try{const name='vcop2-storage-qa-'+Date.now(),assert=(v,s)=>{if(!v)throw Error(s);};db=await openRecords(name);const row={id:'probe',started:1,updated:2,frame:1896,phase:1,scores:[277,1383],best:[277,1383]};await db.record(row);await db.record({...row,updated:3,best:[0,0],scores:[0,0]});let h=await db.history();assert(h.best[0]===277&&h.best[1]===1383&&h.records[0].best[1]===1383,'되감기 최고 기록 보존');await db.save({slot:'manual',frame:1896,data:new Uint8Array([1,2,3]).buffer});await db.save({slot:'auto',frame:2000,data:new Uint8Array([4,5,6]).buffer});db.close();db=await openRecords(name);const manual=await db.state('manual'),auto=await db.state('auto');assert(manual.frame===1896&&new Uint8Array(manual.data)[2]===3&&auto.frame===2000,'재연결 및 독립 슬롯');for(let i=0;i<103;i++)await db.record({...row,id:'probe-'+i,updated:10+i,best:[0,0]});h=await db.history();assert(h.records.length===100&&h.best[0]===277&&h.best[1]===1383,'기록 수 제한과 최고 기록 보존');output.textContent='PASS · 실제 IndexedDB\n최고 기록 보존 · 독립 저장 슬롯 · 재연결 후 바이너리 유지 · 최근 100건 제한';document.body.dataset.result='pass';}catch(e){output.textContent='FAIL · '+e.message;document.body.dataset.result='fail';}finally{db?.close();}};
</script></body></html>
