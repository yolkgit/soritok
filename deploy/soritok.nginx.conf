# 호스트 nginx — soritok.com 을 web 컨테이너(127.0.0.1:8080)로 프록시
# 설치:
#   sudo cp deploy/soritok.nginx.conf /etc/nginx/sites-available/soritok
#   sudo ln -s /etc/nginx/sites-available/soritok /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d soritok.com -d www.soritok.com   # HTTPS(443) 자동 추가
#
# 주의: certbot 이 설치 후 /etc/nginx/sites-available/soritok 을 직접 고쳐
# 443 ssl 블록을 넣는다. 그래서 이 파일을 그대로 덮어쓰면 SSL 설정이 날아간다.
# 이미 certbot 을 돌린 서버에 타임아웃만 반영하려면 부분 패치를 쓸 것:
#   sudo sed -i '/location \/ {/a\        proxy_read_timeout 300s;\n        proxy_send_timeout 300s;' /etc/nginx/sites-available/soritok
#   sudo nginx -t && sudo systemctl reload nginx
# (타임아웃이 필요한 이유: /aqua 도감 생성이 1~2분 걸린다. 컨테이너 nginx 는
#  이미 300s 지만 호스트가 기본 60s 라 여기가 상한이 된다. 지금은 생성 API 가
#  keep-alive 공백 스트리밍으로 버티는 중이라 장애는 없고, 이중 안전장치다.)
server {
    listen 80;
    server_name soritok.com www.soritok.com;

    location / {
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
